<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planner App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="ws-icon" aria-hidden="true">SP</div>
        <div>
          <h1>Study Planner <span id="mode" class="badge"></span></h1>
          <p class="sub">Attività del team</p>
        </div>
      </div>
      <div class="topbar-right">
        <div id="people" class="people" aria-label="Persone online"></div>
        <button id="me" class="me-btn" type="button" title="Cambia nome"></button>
      </div>
    </div>
    <nav class="tabs" aria-label="Filtro attività">
      <button class="tab active" type="button" data-filter="all">Tutte <span class="tab-count" id="count-all"></span></button>
      <button class="tab" type="button" data-filter="mine">Assegnate a me <span class="tab-count" id="count-mine"></span></button>
    </nav>
  </header>

  <main class="board" id="board">
    <section class="column" data-status="todo">
      <header class="column-head">
        <span class="dot dot-todo"></span><h2>Da fare</h2><span class="count"></span>
        <button class="add" type="button" aria-label="Nuova attività in Da fare">+</button>
      </header>
      <div class="cards"></div>
    </section>
    <section class="column" data-status="doing">
      <header class="column-head">
        <span class="dot dot-doing"></span><h2>In corso</h2><span class="count"></span>
        <button class="add" type="button" aria-label="Nuova attività in In corso">+</button>
      </header>
      <div class="cards"></div>
    </section>
    <section class="column" data-status="done">
      <header class="column-head">
        <span class="dot dot-done"></span><h2>Completate</h2><span class="count"></span>
        <button class="add" type="button" aria-label="Nuova attività in Completate">+</button>
      </header>
      <div class="cards"></div>
    </section>
  </main>

  <aside id="panel" class="panel" hidden aria-label="Dettagli attività">
    <div class="panel-bar">
      <button id="close" class="icon-btn" type="button" aria-label="Chiudi">✕</button>
      <span id="saved" class="saved"></span>
      <button id="delete" class="danger-btn" type="button">Elimina</button>
    </div>
    <input id="f-title" class="title-input" placeholder="Senza titolo" autocomplete="off" />
    <div id="typing-title" class="typing"></div>
    <dl class="props">
      <dt>Stato</dt>
      <dd>
        <select id="f-status">
          <option value="todo">Da fare</option>
          <option value="doing">In corso</option>
          <option value="done">Completata</option>
        </select>
      </dd>
      <dt>Etichetta</dt>
      <dd><input id="f-tag" placeholder="Es. Studio, Esame…" autocomplete="off" list="tag-names" maxlength="24" /></dd>
      <dt>Assegnata a</dt>
      <dd><input id="f-assignee" placeholder="Nessuno" autocomplete="off" list="team-names" /></dd>
      <dt>Scadenza</dt>
      <dd><input id="f-due" type="date" /></dd>
    </dl>

    <h3 class="section-title">Descrizione</h3>
    <textarea id="f-notes" class="notes" placeholder="Di cosa si tratta?"></textarea>
    <div id="typing-notes" class="typing"></div>

    <h3 class="section-title">Checklist <span id="check-count" class="muted"></span></h3>
    <div class="progress" id="panel-progress" hidden><div class="bar"><span></span></div></div>
    <ul id="checklist" class="checklist"></ul>
    <button id="add-check" class="add-check" type="button">+ Aggiungi elemento</button>

    <datalist id="team-names"></datalist>
    <datalist id="tag-names"></datalist>
  </aside>

  <dialog id="name-dialog">
    <form method="dialog">
      <h2>Come ti chiami?</h2>
      <p>Il tuo nome appare ai colleghi mentre scrivi.</p>
      <input id="name-input" required maxlength="30" autocomplete="name" />
      <button type="submit">Entra</button>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
